# Todo push em `main` vira deploy na Vercel; isto avisa no GitHub quando tipos,
# lint ou testes quebraram. O build fica com a Vercel, que tem as chaves.
name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
